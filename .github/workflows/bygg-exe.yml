name: Bygg Lagersok_Admin.exe

# Körs när du trycker på "Run workflow" under fliken Actions, och när du laddar upp ändringar i någon av programfilerna.
on:
  workflow_dispatch:
  push:
    paths:
      - 'Lagersok_Admin.py'
      - 'uppdatera_databas.py'
      - 'gor_splash.py'
      - '.github/workflows/bygg-exe.yml'

jobs:
  bygg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installera nödvändiga paket
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check --upgrade pyinstaller openpyxl pdfplumber cryptography pillow
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Valfria paket (scanner och OCR). Misslyckas något bygger vi ändå, men den delen fungerar då inte.
      - name: Installera valfria paket (scanner, OCR)
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check pywin32
          python -m pip install --disable-pip-version-check winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Globalization winrt-Windows.Graphics.Imaging winrt-Windows.Media.Ocr winrt-Windows.Storage.Streams
          python -m pip install --disable-pip-version-check rapidocr_onnxruntime

      - name: Skapa startbild
        shell: pwsh
        run: python gor_splash.py splash_start.png

      - name: Bygg exe-filen
        shell: pwsh
        run: |
          $extra = @()
          python -c "import win32com.client" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Scanner (pywin32) finns'; $extra += @('--hidden-import','win32com.client','--hidden-import','pythoncom','--hidden-import','pywintypes') }
          python -c "import winrt.windows.media.ocr" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Windows OCR finns'; $extra += @('--collect-submodules','winrt','--hidden-import','winrt.windows.media.ocr','--hidden-import','winrt.windows.graphics.imaging','--hidden-import','winrt.windows.storage.streams') }
          python -c "import rapidocr_onnxruntime" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host 'RapidOCR finns'; $extra += @('--collect-all','rapidocr_onnxruntime','--collect-all','onnxruntime') }
          $bygg = @('-m','PyInstaller','--noconfirm','--clean','--onefile','--windowed','--name','Lagersok_Admin',
                    '--hidden-import','uppdatera_databas','--hidden-import','openpyxl',
                    '--collect-all','pdfplumber','--collect-all','pdfminer','--collect-all','pypdfium2',
                    '--collect-all','cryptography','--collect-all','openpyxl','--hidden-import','cryptography.fernet',
                    '--add-data','uppdatera_databas.py;.') + $extra + @('--splash','splash_start.png','Lagersok_Admin.py')
          python @bygg
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path 'dist/Lagersok_Admin.exe')) { Write-Error 'Exe-filen saknas efter bygget'; exit 1 }

      - name: Spara exe-filen
        uses: actions/upload-artifact@v4
        with:
          name: Lagersok_Admin
          path: dist/Lagersok_Admin.exe
          retention-days: 30
