<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#eef1f5;margin:0;padding:0}

.kort{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-top:24px}

.rad{font-size:48px;font-weight:800;text-align:center;margin:16px 0;color:#18222f}

.ok{background:#e8f5d8;color:#2d5a0e;padding:12px;border-radius:10px;margin-top:14px;display:none}
.err{background:#fee2e2;color:#7f1d1d;padding:12px;border-radius:10px;margin-top:14px;display:none}

</style>

<script>
const STAT_URL = "https://sterilsok-stat.pelle-holmstrom.workers.dev";
const params = new URLSearchParams(location.search);
const rad = (params.get("rad")||"").toUpperCase().trim() || "";
document.getElementById("radVis").textContent = rad || "Okänd rad";

function isoVecka(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay()+6)%7);
  const week1 = new Date(date.getFullYear(),0,4);
  const week = 1 + Math.round(((date - week1)/86400000 -3 + (week1.getDay()+6)%7)/7);
  return {year: date.getFullYear(), week: week, str: date.getFullYear()+"-W"+String(week).padStart(2,"0")};
}
const nu = new Date();
const v = isoVecka(nu);
document.getElementById("vecka").value = v.str + " (" + nu.toISOString().slice(0,10) + ")";

// senaste namn från localStorage
try{
  const namn = JSON.parse(localStorage.getItem("stad_namn")||"[]");
  const dl = document.getElementById("namnLista");
  namn.forEach(n=>{ const o=document.createElement("option"); o.value=n; dl.appendChild(o); });
  if(namn[0]) document.getElementById("vem").value = namn[0];
}catch(e){}

async function skicka(){
  const vem = document.getElementById("vem").value.trim();
  if(!rad){ showErr("Ingen rad i QR-koden. Lägg till ?rad=E i länken."); return; }
  if(!vem){ showErr("Skriv vem som städade."); return; }
  const btn = document.getElementById("btn");
  btn.disabled=true; btn.textContent="Skickar...";
  try{
    const payload = {plats: rad, rad: rad, vem: vem, tid: new Date().toISOString(), vecka: v.str, kalla:"qr"};
    // Försök POST till Worker /stad
    const res = await fetch(STAT_URL + "/stad", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("Kunde inte spara ("+res.status+")");
    // spara namn lokalt
    try{
      let list = JSON.parse(localStorage.getItem("stad_namn")||"[]");
      list = [vem, ...list.filter(x=>x!==vem)].slice(0,8);
      localStorage.setItem("stad_namn", JSON.stringify(list));
      // även lokal backup av städning
      let logg = JSON.parse(localStorage.getItem("stad_lokal")||"{}");
      logg[rad] = payload;
      localStorage.setItem("stad_lokal", JSON.stringify(logg));
    }catch(e){}
    document.getElementById("ok").style.display="block";
    document.getElementById("ok").textContent = "Klart! Rad " + rad + " markerad som städad vecka " + v.str + " av " + vem + ".";
    document.getElementById("err").style.display="none";
    btn.textContent="Klar ✓";
  }catch(e){
    showErr("Kunde inte spara: " + e.message + ". Kolla att du har täckning. Försöker spara lokalt ändå.");
    // offline-fallback
    try{
      let q = JSON.parse(localStorage.getItem("stad_ko")||"[]");
      q.push({plats: rad, vem: vem, tid: new Date().toISOString(), vecka: v.str});
      localStorage.setItem("stad_ko", JSON.stringify(q));
    }catch(e2){}
  }
}
function showErr(t){
  const el=document.getElementById("err");
  el.textContent=t; el.style.display="block";
  document.getElementById("btn").disabled=false;
  document.getElementById("btn").textContent="Markera som städad";
}
</script>
</body>
