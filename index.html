 <script>
 (function () {
 var t = null;
 try { t = localStorage.getItem('tema'); } catch (e) {}
 if (!t || (t !== 'mork' && t !== 'ljus' && t !== 'skog' && t !== 'hav' && t !== 'oken')) {
 t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'mork' : 'ljus';
 }
 document.documentElement.setAttribute('data-tema', t);
 var m = document.querySelector('meta[name="theme-color"]');
 if (m) {
   var c = '#419f9f';
   if (t === 'mork') c = '#0b1120';
   else if (t === 'skog') c = '#112211';
   else if (t === 'hav') c = '#081c2e';
   else if (t === 'oken') c = '#2c221e';
   m.setAttribute('content', c);
 }
 })();
 </script>
 <title>Sterilcentrum Sterilförråd Lagersök</title>
 <style>

 .sort-box { flex-direction: column; align-items: stretch; gap: 10px; }

 }

 @media (max-width: 380px) { .chip { font-size: 13px; padding: 8px 4px; } }

 .chip-grupp { align-items: center; }
 .chip-rubrik { text-align: center !important; }
 .chip-rad { justify-content: center; }
 .chip { flex: 0 1 auto; }

.table-responsive { width: 100%; overflow-x: hidden; }
 
.result-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; table-layout: fixed; }
 .result-table th { color: #64748b; text-align: left; padding: 0 12px 4px 12px; font-size: 13px; text-transform: uppercase; font-weight: 700; }
 .result-table td { padding: 16px 12px; background-color: #ffffff; vertical-align: middle; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
 
.result-table td:first-child { border-left: 1px solid #f1f5f9; border-radius: 12px 0 0 12px; }
 
.result-table td:last-child {

.lagerplats-skylt {

background-color: #7fb046;

 .plats-info { background: #e0f2fe; color: #0c4a6e; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.4; }

 /* ===== Hjälp ===== */
 .hjalp-knapp { position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 20px; font-weight: 800; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }

 /* ===== Antal artiklar i databasen ===== */
 .antal-rubrik { font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

 .kamera-botten { position: relative; z-index: 2; margin-top: auto; padding: 12px 14px 22px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.8)); max-height: 55%; overflow-y: auto; }

 /* ===== SOLFJÄDERSMENY FÖR TEMA (5 val) ===== */
 .tema-wrapper {
   position: absolute;
   top: 12px;
   right: 12px;
   z-index: 800;
   width: 40px;
   height: 40px;
 }
 .tema-knapp {
   width: 40px;
   height: 40px;
   border-radius: 50%;
   border: 1px solid #cbd5e1;
   background: #ffffff;
   color: #0f172a;
   font-size: 20px;
   line-height: 1;
   cursor: pointer;
   display: flex;
   align-items: center;
   justify-content: center;
   box-shadow: 0 2px 8px rgba(0,0,0,0.1);
   transition: transform 0.2s ease, background 0.2s ease;
   position: relative;
   z-index: 802;
 }
 .tema-knapp:active { transform: scale(0.92); }
 
 .solfjadrar {
   position: absolute;
   top: 0;
   right: 0;
   width: 40px;
   height: 40px;
   pointer-events: none;
 }
 .solfjadrar.oppen {
   pointer-events: auto;
 }
 .solfjadrar-val {
   position: absolute;
   top: 0;
   right: 0;
   width: 38px;
   height: 38px;
   border-radius: 50%;
   border: 1px solid #cbd5e1;
   background: #ffffff;
   font-size: 18px;
   display: flex;
   align-items: center;
   justify-content: center;
   cursor: pointer;
   box-shadow: 0 4px 10px rgba(0,0,0,0.15);
   opacity: 0;
   transform: translate(0, 0) scale(0.3);
   transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
   z-index: 801;
 }
 .solfjadrar-val:hover {
   transform: scale(1.15) !important;
 }
 /* Solfjäderspositioner för 5 knappar utspridda i en båge */
 .solfjadrar.oppen .solfjadrar-val[data-tema-val="ljus"] {
   opacity: 1;
   transform: translate(-58px, 0px) scale(1);
 }
 .solfjadrar.oppen .solfjadrar-val[data-tema-val="mork"] {
   opacity: 1;
   transform: translate(-50px, 30px) scale(1);
 }
 .solfjadrar.oppen .solfjadrar-val[data-tema-val="skog"] {
   opacity: 1;
   transform: translate(-35px, 52px) scale(1);
 }
 .solfjadrar.oppen .solfjadrar-val[data-tema-val="hav"] {
   opacity: 1;
   transform: translate(-15px, 64px) scale(1);
 }
 .solfjadrar.oppen .solfjadrar-val[data-tema-val="oken"] {
   opacity: 1;
   transform: translate(6px, 68px) scale(1);
 }

 <script>
 let lagerData = [];
 let aktivSort = 'plats';
 const aktivaTyper = { forbruk: true, galler: true };
 let fallande = false;

 const TEMA_IKONER = {

 function ärGaller(p) { return /^\d+:\d+$/.test(p); }

 function valjSort(v) {
 aktivSort = v;
 document.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('aktiv', b.dataset.sort === v));
 sökLager();

 function valjFilter(v) {

 if (!aktivaTyper[v] && !aktivaTyper[annan]) aktivaTyper[annan] = true;
 document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('aktiv', aktivaTyper[b.dataset.filter]));
 sökLager();

 window.addEventListener('DOMContentLoaded', () => {
 try {
 if (typeof window.LAGER_CSV !== 'string' || !window.LAGER_CSV.trim()) throw new Error("Hittade inte data.js - ligger den i samma mapp som index.html?");
 const rawText = window.LAGER_CSV.trim();
 lagerData = hanteraCSV(rawText);
 if (window.LAGER_UPPDATERAD) document.getElementById('dbdatum').innerText = ' · Databas ' + window.LAGER_UPPDATERAD;
 const antalGaller = lagerData.filter(i => ärGaller(i.plats)).length;
 const tal = n => n.toLocaleString('sv-SE');
 document.getElementById('antalArtiklar').innerHTML =
 `<div class="antal-rubrik">Artiklar i databasen</div><div class="antal-rad">` +
 `<div class="antal-kort forbruk"><div class="antal-tal">${tal(lagerData.length - antalGaller)}</div><div class="antal-namn">Fabrikssterilt</div></div>` +
 `<div class="antal-kort galler"><div class="antal-tal">${tal(antalGaller)}</div><div class="antal-namn">Instrumentgaller</div></div></div>`;
 } catch (err) {
 console.error(err);
 document.getElementById('antalArtiklar').innerText = "Kunde inte ladda databasen.";
 document.getElementById('resultatOmråde').innerHTML = "<div class='error'>Fel vid inläsning av data: " + err.message + "</div>";
 }
 });

 function hanteraCSV(text) {
 const rader = text.split('\n');
 if (rader.length <= 1) return [];
 let resultat = [];
 
for (let i = 1; i < rader.length; i++) {
 const rad = rader[i].trim();
 if (!rad) continue;
 
const värden = rad.split(';');
 const hämtaCell = (index) => {
 if (!värden || värden[index] === undefined || värden[index] === null) return '';
 return String(värden[index]).trim();
 };

 resultat.push({
 artnr: hämtaCell(0) || '-',
 lev_artnr: hämtaCell(1) || '-',
 namn: hämtaCell(2) || 'Namn saknas',
 plats: hämtaCell(3) || '-',
 bulk: hämtaCell(4)
 });
 }
 return resultat;
 }

 function esc(t) {
 return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
 }

 function ärRiktigPlats(p) {
 return /^[A-Z]-\d{2}-\d{2}-\d{2}$/.test(p);
 }

 function toggleClearButton() {
 const searchInput = document.getElementById('searchInput');
 const clearBtn = document.getElementById('clearBtn');
 clearBtn.style.display = searchInput.value.length > 0 ? 'flex' : 'none';
 
if (searchInput.value.length === 0) {
 document.getElementById('resultatOmråde').innerHTML = '';
 }
 }

 function clearSearch() {
 const searchInput = document.getElementById('searchInput');
 searchInput.value = '';
 toggleClearButton();
 document.getElementById('resultatOmråde').innerHTML = '';
 searchInput.focus();
 }

 function sokNorm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
 function sokKompakt(t) { return sokNorm(t).replace(/[^a-z0-9]/g, ''); }
 function sokForbered(item) {
 if (item._n !== undefined) return;
 item._r = (item.artnr + ' ' + item.lev_artnr + ' ' + item.namn).toLowerCase();
 item._n = sokNorm(item.artnr + ' ' + item.lev_artnr + ' ' + item.namn);
 item._k = [sokKompakt(item.artnr), sokKompakt(item.lev_artnr)];
 item._t = item._n.split(/[^a-z0-9]+/).filter(Boolean);
 item._tf = item._t.map(sokFon);
 item._tr = item._tf.map(sokRot);
 item._ts = item._tf.map(sokSkelett);
 item._fk = sokFon(sokKompakt(item.namn));
 item._pd = [sokPlatsDelar(item.plats), sokPlatsDelar(item.bulk)];
 }

 function sokFon(w) {
 return w.replace(/ph/g, 'f').replace(/w/g, 'v').replace(/ck/g, 'k')
 .replace(/sch|sh|ch|tj|kj/g, 'sj').replace(/c(?=[eiy])/g, 's').replace(/c/g, 'k')
 .replace(/q/g, 'k').replace(/z/g, 's').replace(/x/g, 'ks').replace(/y/g, 'i')
 .replace(/th/g, 't').replace(/[hgdl]j/g, 'j').replace(/(.)\1+/g, '$1');
 }

 function sokRot(w) {
 for (const suf of ['arna', 'erna', 'orna', 'ande', 'ade', 'ar', 'er', 'or', 'en', 'et', 'na', 'a', 'e', 'n', 's']) {
 if (w.length - suf.length >= 4 && w.endsWith(suf)) return w.slice(0, -suf.length);
 }
 return w;
 }

 function sokAvstand(a, b, max) {
 const la = a.length, lb = b.length;
 if (Math.abs(la - lb) > max) return max + 1;
 let prev2 = null, prev = Array.from({ length: lb + 1 }, (_, j) => j);
 for (let i = 1; i <= la; i++) {
 const cur = [i];
 let minRad = i;
 for (let j = 1; j <= lb; j++) {
 let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
 if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, prev2[j - 2] + 1);
 cur[j] = v; if (v < minRad) minRad = v;
 }
 if (minRad > max) return max + 1;
 prev2 = prev; prev = cur;
 }
 return prev[lb];
 }

 function sokStam(w) {
 let basta = null;
 for (const suf of ['arna', 'erna', 'orna', 'ande', 'ade', 'ar', 'er', 'or', 'en', 'et', 'na', 'a', 'e', 'n', 's']) {
 if (!w.endsWith(suf) || w.length - suf.length < 4) continue;
 const stam = w.slice(0, -suf.length);
 if ((!basta || stam.length > basta.length) && lagerData.some(i => i._n.includes(stam))) basta = stam;
 }
 return basta;
 }
 function sokKompaktTraff(item, ord) {
 const cw = sokKompakt(ord);
 return cw.length >= 3 && (item._k[0].includes(cw) || item._k[1].includes(cw));
 }

 function sokOrdExakt(item, ord) { return item._r.includes(ord.toLowerCase()) || sokKompaktTraff(item, ord); }
 function sokOrdTraff(item, ord) { return item._n.includes(sokNorm(ord)) || sokKompaktTraff(item, ord); }

 function sokMax(len, niva) {
 if (niva === 1) return len >= 9 ? 3 : (len >= 6 ? 2 : 1);
 if (niva === 2) return len >= 12 ? 4 : (len >= 8 ? 3 : (len >= 6 ? 2 : 1));
 return len >= 11 ? 5 : (len >= 8 ? 4 : (len >= 6 ? 3 : (len >= 5 ? 2 : 1));
 }

 function sokSkelett(w) { return w.replace(/[aeiouy]/g, ''); }

 function sokOrdPoang(item, ord, stam, niva) {
 const w = sokKompakt(ord);
 if (w.length < 4 || /\d/.test(w)) return Infinity;
 const wf = sokFon(w), max = sokMax(w.length, niva), rot = sokRot(wf);
 if (wf.length < 3 || new Set(wf).size < 3) return Infinity;
 const forsta = niva === 1;
 const sk = niva >= 3 ? sokSkelett(wf) : '';
 let basta = (stam && item._n.includes(stam)) ? 1 : Infinity;
 for (let i = 0; i < item._tf.length && basta > 0; i++) {
 const t = item._tf[i];
 if (Math.abs(t.length - wf.length) <= max && (!forsta || t[0] === wf[0])) {
 const d = sokAvstand(wf, t, max); if (d <= max && d < basta) basta = d;
 }
 const tr = item._tr[i];
 if (rot.length >= 4 && tr.length >= 4 && (!forsta || tr[0] === rot[0])) {
 const rm = rot.length >= 7 ? 2 : 1;
 const d = sokAvstand(rot, tr, rm) + 0.5; if (d <= rm + 0.5 && d < basta) basta = d;
 }
 if (sk.length >= 4) {
 const ts = item._ts[i];
 if (Math.abs(ts.length - sk.length) <= 1) {
 const dm = sk.length >= 6 ? 1 : 0, d0 = sokAvstand(sk, ts, dm);
 if (d0 <= dm && d0 + 1.5 < basta) basta = d0 + 1.5;
 }
 }
 if (w.length >= 6 && t.length > wf.length - max) {
 for (let L = wf.length - 1; L <= wf.length + 1; L++) {
 for (let st = 0; st + L <= t.length; st++) {
 if (forsta && t[st] !== wf[0]) continue;
 const d = sokAvstand(wf, t.substr(st, L), max) + 0.75;
 if (d <= max + 0.75 && d < basta) basta = d;
 }
 }
 }
 }
 if (niva >= 3 && basta > 0.4 * w.length) return Infinity;
 return basta;
 }

 function sokIhopPoang(item, ord, niva) {
 const wf = sokFon(sokKompakt(ord)), max = sokMax(wf.length, niva), t = item._fk;
 if (wf.length < 6 || /\d/.test(wf) || new Set(wf).size < 3) return Infinity;
 let basta = Infinity;
 for (let L = wf.length - 1; L <= wf.length + 1; L++) {
 for (let st = 0; st + L <= t.length; st++) {
 if (niva === 1 && t[st] !== wf[0]) continue;
 const d = sokAvstand(wf, t.substr(st, L), max) + 1;
 if (d <= max + 1 && d < basta) basta = d;
 }
 }
 return basta;
 }

 function sokBasta(par) {
 if (!par.length) return [];
 const min = Math.min(...par.map(x => x[1]));
 return par.filter(x => x[1] <= min + 1).map(x => x[0]);
 }

 function sokPlatsDelar(t) {
 return (String(t || '').match(/[A-Za-z]+|\d+/g) || []).map(x => /^\d+$/.test(x) ? String(parseInt(x, 10)) : x.toUpperCase());
 }
 function sokPlatsFraga(raw) {
 const t = String(raw || '').trim();
 if (!t || t.length > 14) return null;
 if (/^\d{1,3}:\d{0,3}$/.test(t) || /^[A-Za-z]{1,3}[-\s]?\d{1,3}([-\s]?\d{1,3}){0,3}$/.test(t)) {
 const d = sokPlatsDelar(t);
 return d.length ? d : null;
 }
 return null;
 }
 function sokPlatsVisa(d) {
 if (/^\d+$/.test(d[0])) return d.join(':') + (d.length === 1 ? ':' : '');
 return d.map((x, i) => (i && x.length < 2) ? '0' + x : x).join('-');
 }
 function sokPlatsTraff(item, delar) {
 return item._pd.some(pd => pd.length >= delar.length && delar.every((x, i) => pd[i] === x));
 }

 function sökLager() {
 const sökord = document.getElementById('searchInput').value.trim().toLowerCase();
 const ordLista = sökord.split(/\s+/).filter(Boolean);
 const t0 = performance.now();
 const resultatOmråde = document.getElementById('resultatOmråde');
 const sortVal = aktivSort;
 resultatOmråde.innerHTML = ""; 

if (!sökord) { document.getElementById('söktid').textContent = ''; return; }

 lagerData.forEach(sokForbered);
 const platsFraga = sokPlatsFraga(document.getElementById('searchInput').value);
 let hittade = platsFraga ? lagerData.filter(item => sokPlatsTraff(item, platsFraga)) : [];
 const platsLista = hittade.length > 0;
 if (!platsLista) hittade = lagerData.filter(item => ordLista.every(ord => sokOrdExakt(item, ord)));
 let liknande = false;
 if (hittade.length === 0) hittade = lagerData.filter(item => ordLista.every(ord => sokOrdTraff(item, ord)));
 if (hittade.length === 0) {
 const stammar = ordLista.map(ord => { const w = sokKompakt(ord); return /\d/.test(w) ? null : sokStam(w); });
 const poangVarje = (niva) => {
 const par = [];
 lagerData.forEach(item => {
 let sum = 0;
 for (let k = 0; k < ordLista.length; k++) {
 if (sokOrdTraff(item, ordLista[k])) continue;
 const pk = sokOrdPoang(item, ordLista[k], stammar[k], niva);
 if (pk === Infinity) { sum = Infinity; break; }
 sum += pk;
 }
 if (sum !== Infinity) par.push([item, sum]);
 });
 return par;
 };
 const poangIhop = (niva) => {
 const par = [];
 if (ordLista.length < 2) return par;
 const ihop = ordLista.join('');
 lagerData.forEach(item => { const pk = sokIhopPoang(item, ihop, niva); if (pk !== Infinity) par.push([item, pk]); });
 return par;
 };
 for (const niva of [1, 2, 3]) {
 let par = poangVarje(niva);
 if (!par.length) par = poangIhop(niva);
 if (par.length) { hittade = sokBasta(par); break; }
 }
 liknande = hittade.length > 0;
 if (!hittade.length && ordLista.length >= 2) {
 const par = [];
 lagerData.forEach(item => {
 let saknas = 0, sum = 0;
 for (let k = 0; k < ordLista.length; k++) {
 if (sokOrdTraff(item, ordLista[k])) continue;
 const pk = /\d/.test(ordLista[k]) ? Infinity : sokOrdPoang(item, ordLista[k], stammar[k], 3);
 if (pk === Infinity) { saknas++; if (saknas > 1 || /\d/.test(ordLista[k])) { sum = Infinity; break; } sum += 10; }
 else sum += pk;
 }
 if (sum !== Infinity && saknas === 1) par.push([item, sum]);
 });
 const bra = sokBasta(par);
 if (bra.length && bra.length <= 80) { hittade = bra; liknande = 'delvis'; }
 }
 }

 hittade = hittade.filter(i => aktivaTyper[ärGaller(i.plats) ? 'galler' : 'forbruk']);

 const coll = (x, y) => x.localeCompare(y, 'sv', { numeric: true, sensitivity: 'base' });
 const dir = fallande ? -1 : 1;
 const saknas = v => !v || v === '-';

 hittade.sort((a, b) => {
 if (sortVal === 'plats') {
 const grp = p => ärRiktigPlats(p) ? 0 : (ärGaller(p) ? 1 : 2);
 const ga = grp(a.plats), gb = grp(b.plats);
 if (ga !== gb) return ga - gb;
 let c;
 if (ga === 1) {
 const [a1, a2] = a.plats.split(':').map(Number);
 const [b1, b2] = b.plats.split(':').map(Number);
 c = (a1 - b1) || (a2 - b2);
 } else {
 c = coll(a.plats, b.plats);
 }
 return (c * dir) || coll(a.namn, b.namn);
 }
 if (sortVal === 'namn') return coll(a.namn, b.namn) * dir;
 const sa = saknas(a[sortVal]), sb = saknas(b[sortVal]);
 if (sa !== sb) return sa ? 1 : -1;
 if (sa && sb) return coll(a.namn, b.namn);
 return (coll(a[sortVal], b[sortVal]) * dir) || coll(a.namn, b.namn);
 });

 if (hittade.length > 0) {
 let tabellHtml = `<div class="table-responsive"><table class="result-table"><thead><tr><th>Produktinformation</th><th style="text-align: center; padding: 0 12px 4px 4px;">Plats</th></tr></thead><tbody>`;
 hittade.forEach(artikel => {
 const gallerPlats = /^\d+:\d+$/.test(artikel.plats);
 const artInfo = gallerPlats ? '' : `<div class="art-info-block"><span class="art-no-wrap">Art. Nr: ${esc(artikel.artnr)}</span><span class="art-no-wrap">Lev. Art Nr: ${esc(artikel.lev_artnr)}</span></div>`;
 const typ = gallerPlats ? 'galler' : 'forbruk';
 const typText = gallerPlats ? 'Instrumentgaller' : 'Fabrikssterilt';
 tabellHtml += `<tr class="${typ}"><td><span class="typ-etikett ${typ}">${typText}</span><div class="prod-namn">${esc(artikel.namn)}</div>${artInfo}</td><td><span class="lagerplats-skylt ${typ}">${esc(artikel.plats)}</span>${artikel.bulk ? `<span class="lagerplats-skylt bulk"><small>BULK</small>${esc(artikel.bulk)}</span>` : ''}</td></tr>`;
 });
 tabellHtml += `</tbody></table></div>`;
 resultatOmråde.innerHTML = (platsLista ? `<div class="plats-info">Visar allt som står på hylla ${esc(sokPlatsVisa(platsFraga))}: ${hittade.length} ${hittade.length === 1 ? 'artikel' : 'artiklar'}.</div>` : '') + (liknande ? `<div class="likn-info">Inga exakta träffar för "${esc(document.getElementById('searchInput').value.trim())}". ${liknande === 'delvis' ? 'Visar artiklar som matchar de flesta av orden.' : 'Visar artiklar som liknar sökningen.'} Kontrollera att det är rätt produkt.</div>` : '') + tabellHtml;
 } else {
 resultatOmråde.innerHTML = "<div class='error'>🔍 Inga artiklar matchade din sökning i sterilförrådet.</div>";
 }

 requestAnimationFrame(() => setTimeout(() => {
 const sek = (performance.now() - t0) / 1000;
 document.getElementById('söktid').textContent =
 `Svaret lästes in på ${sek.toFixed(3).replace('.', ',')} sekunder`;
 }, 0));
 }

 document.getElementById('searchInput').addEventListener('keypress', function(e) {
 if (e.key === 'Enter') sökLager();
 });
 </script>

 <script>
 const TESS_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
 const TESS_SPRAK = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int';
 let kamNummerIndex = null;
 let kamStrom = null, kamWorker = null, kamWorkerLovar = null;
 let kamAktiv = false, kamVarv = 0;

 function kamNorm(t) {
 return String(t || '').toUpperCase().replace(',', '.').replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g, '');
 }
 function kamFuzz(t) {
 return t.replace(/[OQD]/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/[B3]/g, '8').replace(/Z/g, '2');
 }
 function kamByggIndex() {
 const exakt = new Map(), fuzz = new Map(), slim = new Map();
 const lagg = (m, nyckel, art) => { if (!m.has(nyckel)) m.set(nyckel, []); m.get(nyckel).push(art); };
 (typeof lagerData !== 'undefined' ? lagerData : []).forEach(a => {
 [a.artnr, a.lev_artnr].forEach(v => {
 const n = kamNorm(v);
 if (n.length < 4 || n === '-') return;
 const nycklar = new Set([n, n.replace(/\s+/g, '')]);
 const ord = n.split(/\s+/);
 if (ord.length > 1 && ord[ord.length - 1].length >= 4) nycklar.add(ord[ord.length - 1]);
 nycklar.forEach(k => {
 if (k.length < 4) return;
 lagg(exakt, k, a); lagg(fuzz, kamFuzz(k), { n: k, a });
 const sl = k.replace(/[-./]/g, '');
 if (sl !== k && sl.length >= 5) { if (!slim.has(sl)) slim.set(sl, new Set()); slim.get(sl).add(k); }
 else if (sl === k && sl.length >= 5) { if (!slim.has(sl)) slim.set(sl, new Set()); slim.get(sl).add(k); }
 });
 });
 });
 kamNummerIndex = { exakt, fuzz, slim };
 }

 function kameraHittaNummer(text) {
 if (!kamNummerIndex) kamByggIndex();
 const { exakt, fuzz, slim } = kamNummerIndex;
 const exakta = new Set(), osakra = new Set();
 const ord = String(text || '').split(/[\s:;()\[\]*"'<>=_]+/).filter(Boolean);
 const slimTraff = (v) => {
 const sl = v.replace(/[-./]/g, '');
 if (sl.length < 5 || !/\d/.test(sl)) return false;
 const m = slim.get(sl);
 if (!m || m.size > 3) return false;
 let ok = false;
 m.forEach(x => { if (exakt.has(x)) { exakta.add(x); ok = true; } });
 return ok;
 };
 for (let i = 0; i + 1 < ord.length; i++) {
 const par = kamNorm(ord[i]) + kamNorm(ord[i + 1]);
 if (par.length >= 4 && exakt.has(par)) exakta.add(par);
 else slimTraff(par);
 }
 ord.forEach(o => {
 const n = kamNorm(o);
 if (n.length < 4) return;
 const varianter = [n, n.replace(/-\d{1,2}$/, '')];
 if (/^[|!]/.test(o)) varianter.push('I' + n);
 if (/^REF./.test(n)) varianter.push(n.slice(3));
 let traff = false;
 varianter.forEach(v => { if (v.length >= 4 && exakt.has(v)) { exakta.add(v); traff = true; } });
 if (!traff) varianter.forEach(v => { if (slimTraff(v)) traff = true; });
 if (!traff && /\d/.test(n) && n.length >= 5) {
 varianter.forEach(v => { const f = fuzz.get(kamFuzz(v)); if (f && v.length >= 5) f.forEach(x => osakra.add(x.n)); });
 }
 });
 exakta.forEach(x => osakra.delete(x));
 return { exakta: [...exakta], osakra: [...osakra] };
 }

 function kamStatus(t) { document.getElementById('kameraStatus').textContent = t; }
 function kamBotten(html) { document.getElementById('kameraBotten').innerHTML = html || ''; }

 function laddaTesseract() {
 if (kamWorkerLovar) return kamWorkerLovar;
 kamWorkerLovar = (async () => {
 if (!window.Tesseract) {
 await new Promise((ok, fel) => {
 const sc = document.createElement('script');
 sc.src = TESS_JS; sc.onload = ok; sc.onerror = () => fel(new Error('nät'));
 document.head.appendChild(sc);
 });
 }
 kamWorker = await Tesseract.createWorker('eng', 1, { langPath: TESS_SPRAK, gzip: true });
 try { localStorage.setItem('kamAnvand', '1'); } catch (e) {}
 return kamWorker;
 })().catch(e => { kamWorkerLovar = null; throw e; });
 return kamWorkerLovar;
 }

 function kamForbattra(canvas) {
 const ctx = canvas.getContext('2d', { willReadFrequently: true });
 const bild = ctx.getImageData(0, 0, canvas.width, canvas.height);
 const d = bild.data, hist = new Uint32Array(256);
 for (let i = 0; i < d.length; i += 4) { const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; d[i] = g; hist[g]++; }
 const tot = d.length / 4;
 let lag = 0, hog = 255, sum = 0;
 for (let v = 0; v < 256; v++) { sum += hist[v]; if (sum >= tot * 0.02) { lag = v; break; } }
 sum = 0;
 for (let v = 255; v >= 0; v--) { sum += hist[v]; if (sum >= tot * 0.02) { hog = v; break; } }
 const spann = Math.max(hog - lag, 40);
 for (let i = 0; i < d.length; i += 4) {
 const g = Math.max(0, Math.min(255, ((d[i] - lag) * 255 / spann) | 0));
 d[i] = d[i + 1] = d[i + 2] = g;
 }
 ctx.putImageData(bild, 0, 0);
 return canvas;
 }

 function kamTaBild(hel) {
 const v = document.getElementById('kameraVideo');
 const vw = v.videoWidth, vh = v.videoHeight;
 if (!vw || !vh) return null;
 let sx = 0, sy = 0, sw = vw, sh = vh;
 if (!hel) {
 const ram = document.querySelector('.kamera-ram').getBoundingClientRect();
 const vr = v.getBoundingClientRect();
 const skala = Math.max(vr.width / vw, vr.height / vh);
 const offX = (vr.width - vw * skala) / 2, offY = (vr.height - vh * skala) / 2;
 sx = Math.max(0, (ram.left - vr.left - offX) / skala);
 sy = Math.max(0, (ram.top - vr.top - offY) / skala);
 sw = Math.min(vw - sx, ram.width / skala);
 sh = Math.min(vh - sy, ram.height / skala);
 }
 const mal = Math.min(1, (hel ? 1100 : 900) / Math.max(sw, sh));
 const c = document.createElement('canvas');
 c.width = Math.max(1, Math.round(sw * mal)); c.height = Math.max(1, Math.round(sh * mal));
 c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
 return kamForbattra(c);
 }

 async function kamLas(canvas, psm) {
 await kamWorker.setParameters({ tessedit_pageseg_mode: String(psm) });
 const { data } = await kamWorker.recognize(canvas);
 return data.text || '';
 }

 function kamVisaVal(exakta, osakra) {
 const rad = (nr, osaker) => {
 const art = (kamNummerIndex.exakt.get(nr) || [])[0];
 return `<button type="button" class="kamera-val" data-nr="${esc(nr)}">${esc(nr)}${art ? `<small>${esc(art.namn)} · ${esc(art.plats)}</small>` : ''}</button>`;
 };
 kamStatus(exakta.length ? 'Flera träffar, välj rätt' : 'Menade du något av dessa?');
 kamBotten(exakta.map(n => rad(n)).concat(osakra.filter(n => kamNummerIndex.exakt.has(n)).map(n => rad(n))).join('') +
 '<button type="button" class="kamera-igen" onclick="kamStart()">Läs av igen</button>');
 document.querySelectorAll('.kamera-val').forEach(b => b.onclick = () => kamValj(b.dataset.nr));
 }

 function kamValj(nr) {
 stangKamera();
 const inp = document.getElementById('searchInput');
 inp.value = nr;
 toggleClearButton();
 sökLager();
 try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
 }

 let kamOsakra = new Set();
 function kamHantera(text, slutgiltig) {
 const r = kameraHittaNummer(text);
 if (r.exakta.length === 1) { kamValj(r.exakta[0]); return true; }
 if (r.exakta.length > 1) { kamAktiv = false; kamVisaVal(r.exakta, []); return true; }
 r.osakra.forEach(n => kamOsakra.add(n));
 if (kamOsakra.size && slutgiltig) { kamAktiv = false; kamVisaVal([], [...kamOsakra]); return true; }
 return false;
 }

 async function kamStart() {
 kamAktiv = true; kamVarv = 0; kamOsakra = new Set();
 kamBotten('');
 kamStatus('Håll REF-numret i rutan');
 const klart = Date.now() + 60000;
 const upplagg = [[false, 6], [true, 11], [false, 11], [true, 6], [false, 6], [false, 11]];
 while (kamAktiv && Date.now() < klart) {
 const [hel, psm] = upplagg[kamVarv++ % upplagg.length];
 const bild = kamTaBild(hel);
 if (!bild) { await new Promise(r => setTimeout(r, 300)); continue; }
 let text = '';
 try { text = await kamLas(bild, psm); } catch (e) { kamStatus('Textläsningen misslyckades'); break; }
 if (!kamAktiv) return;
 if (kamHantera(text, kamVarv >= 12)) return;
 await new Promise(r => setTimeout(r, 20));
 }
 if (kamAktiv && kamOsakra.size) { kamAktiv = false; kamVisaVal([], [...kamOsakra]); return; }
 if (kamAktiv) {
 kamAktiv = false;
 kamStatus('Hittade inget nummer som finns i databasen');
 kamBotten('<button type="button" class="kamera-igen" onclick="kamStart()">Försök igen</button>');
 }
 }

 async function kamLasSkarm() {
 try {
 const o = screen.orientation;
 if (!o || !o.lock) return;
 try { await o.lock('portrait'); kamLast = true; return; } catch (e) {}
 const el = document.documentElement;
 if (el.requestFullscreen && !document.fullscreenElement) {
 await el.requestFullscreen(); kamHelskarm = true;
 await o.lock('portrait'); kamLast = true;
 }
 } catch (e) {}
 }
 let kamLast = false, kamHelskarm = false;
 function kamLosSkarm() {
 try { if (kamLast) screen.orientation.unlock(); } catch (e) {}
 try { if (kamHelskarm && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
 kamLast = false; kamHelskarm = false;
 }

 async function oppnaKamera() {
 const lager = document.getElementById('kameraLager');
 lager.hidden = false;
 kamLasSkarm();
 kamBotten('');
 kamStatus('Startar kameran...');
 try {
 kamStrom = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
 } catch (e) {
 kamStatus('Kameran kunde inte startas. Tillåt kameran för sidan i webbläsarens inställningar.');
 kamBotten('<button type="button" class="kamera-igen" onclick="document.getElementById(\'kameraFil\').click()">Ta en bild istället</button>');
 return;
 }
 const video = document.getElementById('kameraVideo');
 video.srcObject = kamStrom;
 try { await video.play(); } catch (e) {}
 try { const sp = kamStrom.getVideoTracks()[0]; sp.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch (e) {}
 kamStatus('Hämtar textläsaren... (första gången tar det en stund)');
 try { await laddaTesseract(); }
 catch (e) {
 kamStatus('Kunde inte hämta textläsaren. Kontrollera nätet och försök igen.');
 kamBotten('<button type="button" class="kamera-igen" onclick="oppnaKamera()">Försök igen</button>');
 return;
 }
 if (document.getElementById('kameraLager').hidden) return;
 kamStart();
 }

 function stangKamera() {
 kamAktiv = false;
 document.getElementById('kameraLager').hidden = true;
 kamLosSkarm();
 if (kamStrom) { kamStrom.getTracks().forEach(t => t.stop()); kamStrom = null; }
 const v = document.getElementById('kameraVideo'); if (v) v.srcObject = null;
 }

 document.getElementById('kameraFil').addEventListener('change', async (e) => {
 const fil = e.target.files && e.target.files[0];
 e.target.value = '';
 if (!fil) return;
 kamStatus('Läser bilden...');
 try {
 await laddaTesseract();
 const bm = await createImageBitmap(fil);
 const mal = Math.min(1, 1800 / Math.max(bm.width, bm.height));
 const c = document.createElement('canvas');
 c.width = Math.round(bm.width * mal); c.height = Math.round(bm.height * mal);
 c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
 kamForbattra(c);
 kamOsakra = new Set();
 for (const psm of [11, 6]) { if (kamHantera(await kamLas(c, psm), psm === 6)) return; }
 kamStatus('Hittade inget nummer som finns i databasen');
 kamBotten('<button type="button" class="kamera-igen" onclick="document.getElementById(\'kameraFil\').click()">Ta en ny bild</button>');
 } catch (err) { kamStatus('Kunde inte läsa bilden'); }
 });

 document.addEventListener('visibilitychange', () => { if (document.hidden) stangKamera(); });

 document.getElementById('kameraKnapp').classList.add('finns');
 let anvand = false; try { anvand = localStorage.getItem('kamAnvand') === '1'; } catch (e) {}

 <script>
 (function () {
 const GUNILLA_LJUD = 'https://soundcloud.com/plastpappa/gunilla-persson-i-wont-shake-la-la-gunilla-epa-remix';
 const MAROCKO_LJUD = 'https://archive.org/details/jil-jilala-nakar-lahsane/%D8%A7%D9%84%D8%B4%D9%85%D8%B9%D8%A9+.mp3';
 const knappar = [
 { id: 'fredagKnapp', ljud: GUNILLA_LJUD, syns: d => d.getDay() === 5 },
 { id: 'marockoKnapp', ljud: MAROCKO_LJUD, syns: d => d.getMonth() === 6 && d.getDate() === 30 }
 ];

 let aktiv = null;
 function stoppa() {
 if (!aktiv) return;
 if (aktiv.ram.pause) { try { aktiv.ram.pause(); aktiv.ram.removeAttribute('src'); aktiv.ram.load(); } catch (e) {} }
 else aktiv.ram.remove();
 aktiv.knapp.classList.remove('spelar');
 aktiv = null;
 }
 function skicka(ram, m) { try { ram.contentWindow.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
 function ljudFil(url) {
 const m = String(url).match(/archive\.org\/(?:details|download)\/([^/?#]+)\/([^?#]+)/);
 if (m) { let f = m[2].replace(/\+/g, ' '); try { f = decodeURIComponent(f); } catch (e) {} return 'https://archive.org/download/' + m[1] + '/' + encodeURIComponent(f); }
 return /\.(mp3|m4a|ogg|wav)(\?|#|$)/i.test(url) ? url : null;
 }
 function skapaLjud(fil, el) {
 const a = new Audio();
 a.preload = 'auto';
 a.src = fil;
 a.addEventListener('ended', () => { if (aktiv && aktiv.ram === a) stoppa(); });
 a.addEventListener('error', () => { if (aktiv && aktiv.ram === a) stoppa(); });
 const lofte = a.play();
 if (lofte && lofte.catch) lofte.catch(() => { if (aktiv && aktiv.ram === a) stoppa(); });
 return a;
 }
 function skapaRam(url) {
 const yt = String(url).match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([\w-]{11})/);
 const ram = document.createElement('iframe');
 let typ;
 if (yt) {
 typ = 'yt';
 ram.src = 'https://www.youtube.com/embed/' + yt[1] + '?autoplay=1&playsinline=1&controls=0&enablejsapi=1&rel=0&origin=' + encodeURIComponent(location.origin);
 ram.allow = 'autoplay; encrypted-media';
 } else if (/soundcloud\.com/.test(url)) {
 typ = 'sc';
 ram.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
 '&auto_play=true&visual=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&buying=false&sharing=false&download=false';
 ram.allow = 'autoplay';
 } else return null;
 ram.title = '';
 ram.setAttribute('aria-hidden', 'true');
 ram.tabIndex = -1;
 ram.style.cssText = 'position:fixed;left:-400px;top:0;width:300px;height:200px;border:0;opacity:0;pointer-events:none;';
 ram.addEventListener('load', () => {
 if (typ === 'yt') skicka(ram, { event: 'listening', id: 1, channel: 'widget' });
 else { skicka(ram, { method: 'addEventListener', value: 'finish' }); skicka(ram, { method: 'play' }); }
 });
 return ram;
 }
 function visa() {
 const nu = new Date();
 knappar.forEach(k => { const el = document.getElementById(k.id); if (el) el.classList.toggle('finns', k.syns(nu)); });
 }
 knappar.forEach(k => {
 const el = document.getElementById(k.id);
 if (!el) return;
 el.addEventListener('click', () => {
 if (aktiv && aktiv.knapp === el) { stoppa(); return; }
 stoppa();
 if (!k.ljud) return;
 const fil = ljudFil(k.ljud);
 if (fil) { aktiv = { knapp: el, ram: null }; const a = skapaLjud(fil, el); aktiv.ram = a; el.classList.add('spelar'); return; }
 const ram = skapaRam(k.ljud);
 if (!ram) return;
 document.body.appendChild(ram);
 el.classList.add('spelar');
 aktiv = { knapp: el, ram };
 });
 });
 window.addEventListener('message', (e) => {
 if (!aktiv || !aktiv.ram || !aktiv.ram.contentWindow || e.source !== aktiv.ram.contentWindow) return;
 try {
 const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
 if (!d) return;
 if (d.method === 'ready') { skicka(aktiv.ram, { method: 'addEventListener', value: 'finish' }); skicka(aktiv.ram, { method: 'play' }); }
 if (d.method === 'finish' || (d.event === 'onStateChange' && d.info === 0)) stoppa();
 } catch (x) {}
 });
 visa();
 document.addEventListener('visibilitychange', () => { if (!document.hidden) visa(); });
 })();
 </script>
 <script>

 const ua = navigator.userAgent || '';
 return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
 }
 function hjalpText() {
 const telefon = hjalpArTelefon();

 const dot = (farg) => `<span class="prick" style="background:${farg}"></span>`;

 </ul>`;
 h += `<h3>Visa och sortera</h3>
 <p><b>Visa</b> väljer om du vill se Fabrikssterilt, Instrumentgaller eller båda. Minst en måste vara vald. <b>Sortera</b> ordnar träffarna efter plats, namn, artikelnummer eller leverantörens nummer.</p>`;

 </ul>`;
 if (telefon && harKamera) {

 <ol>

 </ol>
 <p>Tänk på: första gången hämtas textläsaren (cirka 8 MB), så det behövs nät. Det går bäst med bra ljus och en skarp bild. Streckkoder läses inte, bara tryckt text. Om kameran inte startar kan du välja <b>Ta en bild istället</b>.</p>`;
 }
 if (telefon) {
 if (hjalpArIphone()) {
 h += `<h3>Lägg appen på hemskärmen (iPhone)</h3>
 <p>Öppna sidan i Safari, tryck på dela-ikonen (rutan med pilen uppåt) och välj <b>Lägg till på hemskärmen</b>. Då startar den som en vanlig app.</p>`;
 } else {

 }
 } else {

 }
 h += `<h3>Teman</h3>

 <h3>Utan nät och databasens datum</h3>
 <p>Appen sparar sig själv och databasen och fungerar även utan täckning efter första besöket. Längst ner står när databasen senast uppdaterades.</p>`;
 return h;
 }
