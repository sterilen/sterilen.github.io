    <script>
        // ======================= KAMERALÄGE =======================
        // Läser texten på förpackningen med kameran och letar efter ett nummer som finns i databasen
        // (leverantörens artikelnummer, "REF", eller vårt eget artikelnummer). Textläsaren (Tesseract.js)
        // hämtas först när man trycker på kameraknappen, ligger mappen tesseract bredvid sidan används den, annars behövs nät första gången (ca 8 MB).
        const TESS_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        const TESS_SPRAK = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int';
        let kamNummerIndex = null;
        let kamStrom = null, kamWorker = null, kamWorkerLovar = null;
        let kamAktiv = false, kamVarv = 0;

        function kamNorm(t) {
            return String(t || '').toUpperCase().replace(',', '.').replace(/^[^A-Z0-9]+|[^A-Z0-9]+$/g, '');
        }
        // Tecken som textläsaren ofta förväxlar
        function kamFuzz(t) {
            return t.replace(/[OQD]/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/[B3]/g, '8').replace(/Z/g, '2');
        }
        function kamByggIndex() {
            const exakt = new Map(), fuzz = new Map(), slim = new Map();
            const lagg = (m, nyckel, art) => { if (!m.has(nyckel)) m.set(nyckel, []); m.get(nyckel).push(art); };
            (typeof lagerData !== 'undefined' ? lagerData : []).forEach(a => {
                [a.artnr, a.lev_artnr].forEach(v => {
                    const n = kamNorm(v);
                    if (n.length < 4 || n === '-') return;
                    // Vissa nummer är registrerade med prefix och mellanslag, t.ex. "PN 470500".
                    // Då räcker det att numret efter mellanslaget, eller hela utan mellanslag, hittas.
                    const nycklar = new Set([n, n.replace(/\s+/g, '')]);
                    const ord = n.split(/\s+/);
                    if (ord.length > 1 && ord[ord.length - 1].length >= 4) nycklar.add(ord[ord.length - 1]);
                    nycklar.forEach(k => {
                        if (k.length < 4) return;
                        lagg(exakt, k, a); lagg(fuzz, kamFuzz(k), { n: k, a });
                        // Utan bindestreck, punkt och snedstreck, så att "AB-123" på förpackningen hittar "AB123" i databasen och tvärtom
                        const sl = k.replace(/[-./]/g, '');
                        if (sl !== k && sl.length >= 5) { if (!slim.has(sl)) slim.set(sl, new Set()); slim.get(sl).add(k); }
                        else if (sl === k && sl.length >= 5) { if (!slim.has(sl)) slim.set(sl, new Set()); slim.get(sl).add(k); }
                    });
                });
            });
            kamNummerIndex = { exakt, fuzz, slim };
        }
        // text -> { exakta: [nummer], osakra: [nummer] }
        function kameraHittaNummer(text) {
            if (!kamNummerIndex) kamByggIndex();
            const { exakt, fuzz, slim } = kamNummerIndex;
            const exakta = new Set(), osakra = new Set();
            const ord = String(text || '').split(/[\s:;()\[\]*"'<>=_]+/).filter(Boolean);
            // Träff på ett nummer som bara skiljer sig i bindestreck, punkt eller snedstreck. Ger databasens egen stavning.
            const slimTraff = (v) => {
                const sl = v.replace(/[-./]/g, '');
                if (sl.length < 5 || !/\d/.test(sl)) return false;
                const m = slim.get(sl);
                if (!m || m.size > 3) return false;
                let ok = false;
                m.forEach(x => { if (exakt.has(x)) { exakta.add(x); ok = true; } });
                return ok;
            };
            for (let i = 0; i + 1 < ord.length; i++) {       // två ord i följd, t.ex. "DAR 630" eller "REF 852.01"
                const par = kamNorm(ord[i]) + kamNorm(ord[i + 1]);
                if (par.length >= 4 && exakt.has(par)) exakta.add(par);
                else slimTraff(par);
            }
            ord.forEach(o => {
                const n = kamNorm(o);
                if (n.length < 4) return;
                const varianter = [n, n.replace(/-\d{1,2}$/, '')];                  // Intuitive skriver "470015-08"
                if (/^[|!]/.test(o)) varianter.push('I' + n);                        // litet i läses ofta som |
                if (/^REF./.test(n)) varianter.push(n.slice(3));                     // "REF470015"
                let traff = false;
                varianter.forEach(v => { if (v.length >= 4 && exakt.has(v)) { exakta.add(v); traff = true; } });
                if (!traff) varianter.forEach(v => { if (slimTraff(v)) traff = true; });
                if (!traff && /\d/.test(n) && n.length >= 5) {
                    varianter.forEach(v => { const f = fuzz.get(kamFuzz(v)); if (f && v.length >= 5) f.forEach(x => osakra.add(x.n)); });
                }
            });
            exakta.forEach(x => osakra.delete(x));
            return { exakta: [...exakta], osakra: [...osakra] };
        }

        function kamStatus(t) { document.getElementById('kameraStatus').textContent = t; }
        function kamBotten(html) { document.getElementById('kameraBotten').innerHTML = html || ''; }

        // Textläsaren ligger helst i mappen "tesseract" bredvid index.html (då behövs inget internet och inget kan blockeras).
        // Saknas mappen hämtas den från internet som reserv.
        function kamLaddaSkript(src) {
            return new Promise((ok, fel) => {
                const sc = document.createElement('script');
                sc.src = src; sc.onload = ok; sc.onerror = () => { sc.remove(); fel(new Error('nät')); };
                document.head.appendChild(sc);
            });
        }
        function laddaTesseract() {
            if (kamWorkerLovar) return kamWorkerLovar;
            kamWorkerLovar = (async () => {
                let lokal = false;
                if (!window.Tesseract) {
                    try { await kamLaddaSkript('tesseract/tesseract.min.js'); lokal = true; }
                    catch (e) { await kamLaddaSkript(TESS_JS); }
                }
                if (lokal) {
                    const bas = new URL('tesseract/', location.href).href;   // måste vara fullständiga adresser (arbetaren startas från en blob)
                    try {
                        kamWorker = await Tesseract.createWorker('eng', 1, { workerPath: bas + 'worker.min.js', corePath: bas, langPath: bas + 'lang', gzip: true });
                    } catch (e) { kamWorker = null; }       // filer saknas eller är trasiga: använd internet i stället
                }
                if (!kamWorker) kamWorker = await Tesseract.createWorker('eng', 1, { langPath: TESS_SPRAK, gzip: true });
                try { localStorage.setItem('kamAnvand', '1'); } catch (e) {}
                return kamWorker;
            })().catch(e => { kamWorkerLovar = null; throw e; });
            return kamWorkerLovar;
        }

        // Gör bilden gråskala och drar ut kontrasten, det gör det lättare att läsa grå text på vitt papper
        function kamForbattra(canvas) {
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const bild = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const d = bild.data, hist = new Uint32Array(256);
            for (let i = 0; i < d.length; i += 4) { const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; d[i] = g; hist[g]++; }
            const tot = d.length / 4;
            let lag = 0, hog = 255, sum = 0;
            for (let v = 0; v < 256; v++) { sum += hist[v]; if (sum >= tot * 0.02) { lag = v; break; } }
            sum = 0;
            for (let v = 255; v >= 0; v--) { sum += hist[v]; if (sum >= tot * 0.02) { hog = v; break; } }
            const spann = Math.max(hog - lag, 40);
            for (let i = 0; i < d.length; i += 4) {
                const g = Math.max(0, Math.min(255, ((d[i] - lag) * 255 / spann) | 0));
                d[i] = d[i + 1] = d[i + 2] = g;
            }
            ctx.putImageData(bild, 0, 0);
            return canvas;
        }

        // Tar en bild ur videon. hel=true: hela bilden, annars bara rutan på skärmen.
        function kamTaBild(hel) {
            const v = document.getElementById('kameraVideo');
            const vw = v.videoWidth, vh = v.videoHeight;
            if (!vw || !vh) return null;
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (!hel) {
                // Rutan på skärmen omräknad till bildpunkter i videon (videon fyller skärmen med object-fit: cover)
                const ram = document.querySelector('.kamera-ram').getBoundingClientRect();
                const vr = v.getBoundingClientRect();
                const skala = Math.max(vr.width / vw, vr.height / vh);
                const offX = (vr.width - vw * skala) / 2, offY = (vr.height - vh * skala) / 2;
                sx = Math.max(0, (ram.left - vr.left - offX) / skala);
                sy = Math.max(0, (ram.top - vr.top - offY) / skala);
                sw = Math.min(vw - sx, ram.width / skala);
                sh = Math.min(vh - sy, ram.height / skala);
            }
            const mal = Math.min(1, (hel ? 1100 : 900) / Math.max(sw, sh));   // mindre bild går snabbare att läsa
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(sw * mal)); c.height = Math.max(1, Math.round(sh * mal));
            c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
            return kamForbattra(c);
        }

        async function kamLas(canvas, psm) {
            await kamWorker.setParameters({ tessedit_pageseg_mode: String(psm) });
            const { data } = await kamWorker.recognize(canvas);
            return data.text || '';
        }

        function kamVisaVal(exakta, osakra) {
            const rad = (nr, osaker) => {
                const art = (kamNummerIndex.exakt.get(nr) || [])[0];
                return `<button type="button" class="kamera-val" data-nr="${esc(nr)}">${esc(nr)}${art ? `<small>${esc(art.namn)} · ${esc(art.plats)}</small>` : ''}</button>`;
            };
            kamStatus(exakta.length ? 'Flera träffar, välj rätt' : 'Menade du något av dessa?');
            kamBotten(exakta.map(n => rad(n)).concat(osakra.filter(n => kamNummerIndex.exakt.has(n)).map(n => rad(n))).join('') +
                '<button type="button" class="kamera-igen" onclick="kamStart()">Läs av igen</button>');
            document.querySelectorAll('.kamera-val').forEach(b => b.onclick = () => kamValj(b.dataset.nr));
        }

        function kamValj(nr) {
            stangKamera();
            const inp = document.getElementById('searchInput');
            inp.value = nr;
            toggleClearButton();
            statKalla = 1; statSist = '';
            sökLager();
            try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
        }

        // Tar emot text och avgör vad som ska hända. Ger true om vi är klara.
        // Osäkra träffar (t.ex. 3 som lästs i stället för 8) samlas och visas först om inget säkert nummer dyker upp.
        let kamOsakra = new Set();
        function kamHantera(text, slutgiltig) {
            const r = kameraHittaNummer(text);
            // Står både artikelnummer och leverantörens nummer på etiketten ger de två träffar på samma artikel. Då är det ingen fråga om val.
            if (r.exakta.length > 1) {
                const nyckel = nr => (kamNummerIndex.exakt.get(nr) || []).map(a => a.artnr + '|' + a.lev_artnr + '|' + a.plats).sort().join(';');
                const k0 = nyckel(r.exakta[0]);
                if (k0 && r.exakta.every(nr => nyckel(nr) === k0)) r.exakta = [r.exakta[0]];
            }
            if (r.exakta.length === 1) { kamValj(r.exakta[0]); return true; }
            if (r.exakta.length > 1) { kamAktiv = false; kamVisaVal(r.exakta, []); return true; }
            r.osakra.forEach(n => kamOsakra.add(n));
            if (kamOsakra.size && slutgiltig) { kamAktiv = false; kamVisaVal([], [...kamOsakra]); return true; }
            return false;
        }

        async function kamStart() {
            kamAktiv = true; kamVarv = 0; kamOsakra = new Set();
            kamBotten('');
            kamStatus('Håll REF-numret i rutan');
            const klart = Date.now() + 60000;
            // Oftast bara rutan (snabbast), varannan gång hela bilden ifall numret står utanför rutan
            const upplagg = [[false, 6], [true, 11], [false, 11], [true, 6], [false, 6], [false, 11]];
            while (kamAktiv && Date.now() < klart) {
                const [hel, psm] = upplagg[kamVarv++ % upplagg.length];
                const bild = kamTaBild(hel);
                if (!bild) { await new Promise(r => setTimeout(r, 300)); continue; }
                let text = '';
                try { text = await kamLas(bild, psm); } catch (e) { kamStatus('Textläsningen misslyckades'); break; }
                if (!kamAktiv) return;
                if (kamHantera(text, false)) return;
                if (kamAktiv && kamVarv >= 12 && kamOsakra.size) { kamAktiv = false; kamVisaVal([], [...kamOsakra]); return; }
                await new Promise(r => setTimeout(r, 20));
            }
            if (kamAktiv && kamOsakra.size) { kamAktiv = false; kamVisaVal([], [...kamOsakra]); return; }
            if (kamAktiv) {
                kamAktiv = false;
                kamStatus('Hittade inget nummer som finns i databasen');
                kamBotten('<button type="button" class="kamera-igen" onclick="kamStart()">Försök igen</button>');
            }
        }

        // Försöker låsa skärmen i stående läge medan kameran är öppen (fungerar på Android; iPhone tillåter det inte i webbläsare)
        async function kamLasSkarm() {
            try {
                const o = screen.orientation;
                if (!o || !o.lock) return;
                try { await o.lock('portrait'); kamLast = true; return; } catch (e) {}
                // Chrome på Android kräver ofta helskärm för att få låsa
                const el = document.documentElement;
                if (el.requestFullscreen && !document.fullscreenElement) {
                    await el.requestFullscreen(); kamHelskarm = true;
                    await o.lock('portrait'); kamLast = true;
                }
            } catch (e) {}
        }
        let kamLast = false, kamHelskarm = false;
        function kamLosSkarm() {
            try { if (kamLast) screen.orientation.unlock(); } catch (e) {}
            try { if (kamHelskarm && document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
            kamLast = false; kamHelskarm = false;
        }

        async function oppnaKamera() {
            const lager = document.getElementById('kameraLager');
            lager.hidden = false;
            kamLasSkarm();
            kamBotten('');
            kamStatus('Startar kameran...');
            try {
                kamStrom = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
            } catch (e) {
                kamStatus('Kameran kunde inte startas. Tillåt kameran för sidan i webbläsarens inställningar.');
                kamBotten('<button type="button" class="kamera-igen" onclick="document.getElementById(\'kameraFil\').click()">Ta en bild istället</button>');
                return;
            }
            const video = document.getElementById('kameraVideo');
            video.srcObject = kamStrom;
            try { await video.play(); } catch (e) {}
            try { const sp = kamStrom.getVideoTracks()[0]; sp.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch (e) {}
            kamStatus('Hämtar textläsaren... (första gången tar det en stund)');
            try { await laddaTesseract(); }
            catch (e) {
                kamStatus('Kunde inte hämta textläsaren. Kontrollera nätet och försök igen.');
                kamBotten('<button type="button" class="kamera-igen" onclick="oppnaKamera()">Försök igen</button>');
                return;
            }
            if (document.getElementById('kameraLager').hidden) return;
            statKameraOppnad();
            kamStart();
        }

        function stangKamera() {
            kamAktiv = false;
            document.getElementById('kameraLager').hidden = true;
            kamLosSkarm();
            if (kamStrom) { kamStrom.getTracks().forEach(t => t.stop()); kamStrom = null; }
            const v = document.getElementById('kameraVideo'); if (v) v.srcObject = null;
        }

        // Reserv: en vanlig bild från kameraappen (om live-kameran inte går att använda)
        document.getElementById('kameraFil').addEventListener('change', async (e) => {
            const fil = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!fil) return;
            kamStatus('Läser bilden...');
            try {
                await laddaTesseract();
                const bm = await createImageBitmap(fil);
                const mal = Math.min(1, 1800 / Math.max(bm.width, bm.height));
                const c = document.createElement('canvas');
                c.width = Math.round(bm.width * mal); c.height = Math.round(bm.height * mal);
                c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
                kamForbattra(c);
                kamOsakra = new Set();
                for (const psm of [11, 6]) { if (kamHantera(await kamLas(c, psm), psm === 6)) return; }
                kamStatus('Hittade inget nummer som finns i databasen');
                kamBotten('<button type="button" class="kamera-igen" onclick="document.getElementById(\'kameraFil\').click()">Ta en ny bild</button>');
            } catch (err) { kamStatus('Kunde inte läsa bilden'); }
        });

        document.addEventListener('visibilitychange', () => { if (document.hidden) stangKamera(); });

        // Knappen visas bara på enheter med kamera och pekskärm (alltså inte på vanliga datorer)
        (function () {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.matchMedia('(pointer: coarse)').matches) {
                    document.getElementById('kameraKnapp').classList.add('finns');
                    // Har kameran använts förut ligger textläsaren redan sparad. Då förbereds den i bakgrunden så att kameran startar fortare.
                    let anvand = false; try { anvand = localStorage.getItem('kamAnvand') === '1'; } catch (e) {}
                    if (anvand) setTimeout(() => { laddaTesseract().catch(() => {}); }, 2500);
                }
            } catch (e) {}
        })();
    </script>
    <script>
        // ======================= MUSIKKNAPPAR =======================
        // Små knappar längst ner som bara syns vissa dagar. Ett tryck spelar ljudet från en länk (YouTube, SoundCloud, archive.org eller en mp3-fil)
        // utan att visa något (ingen spelare, inga reglage). Nästa tryck stoppar. Bara en spelar åt gången.
        (function () {
            // ---- Inställningar ----
            const GUNILLA_LJUD = 'https://soundcloud.com/plastpappa/gunilla-persson-i-wont-shake-la-la-gunilla-epa-remix';
            const MAROCKO_LJUD = 'https://archive.org/details/jil-jilala-nakar-lahsane/%D8%A7%D9%84%D8%B4%D9%85%D8%B9%D8%A9+.mp3';   // Jil Jilala – Chamaa (archive.org)
            const knappar = [
                { id: 'fredagKnapp', ljud: GUNILLA_LJUD, syns: d => d.getDay() === 5 },                       // fredagar
                { id: 'marockoKnapp', ljud: MAROCKO_LJUD, syns: d => d.getMonth() === 6 && d.getDate() === 30 } // 30 juli
            ];
            // ---- Slut på inställningar ----

            let aktiv = null;                                  // { knapp, ram }
            function stoppa() {
                if (!aktiv) return;
                if (aktiv.ram.pause) { try { aktiv.ram.pause(); aktiv.ram.removeAttribute('src'); aktiv.ram.load(); } catch (e) {} }
                else aktiv.ram.remove();                       // tar man bort spelaren tystnar ljudet direkt
                aktiv.knapp.classList.remove('spelar');
                aktiv = null;
            }
            function skicka(ram, m) { try { ram.contentWindow.postMessage(JSON.stringify(m), '*'); } catch (e) {} }
            // archive.org/details/ID/FIL.mp3 -> direktlänk till filen
            function ljudFil(url) {
                const m = String(url).match(/archive\.org\/(?:details|download)\/([^/?#]+)\/([^?#]+)/);
                if (m) { let f = m[2].replace(/\+/g, ' '); try { f = decodeURIComponent(f); } catch (e) {} return 'https://archive.org/download/' + m[1] + '/' + encodeURIComponent(f); }
                return /\.(mp3|m4a|ogg|wav)(\?|#|$)/i.test(url) ? url : null;
            }
            function skapaLjud(fil, el) {
                const a = new Audio();
                a.preload = 'auto';
                a.src = fil;
                a.addEventListener('ended', () => { if (aktiv && aktiv.ram === a) stoppa(); });
                a.addEventListener('error', () => { if (aktiv && aktiv.ram === a) stoppa(); });
                const lofte = a.play();                        // måste ske direkt vid trycket, annars blockerar iPhone det
                if (lofte && lofte.catch) lofte.catch(() => { if (aktiv && aktiv.ram === a) stoppa(); });
                return a;
            }
            function skapaRam(url) {
                const yt = String(url).match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([\w-]{11})/);
                const ram = document.createElement('iframe');
                let typ;
                if (yt) {
                    typ = 'yt';
                    ram.src = 'https://www.youtube.com/embed/' + yt[1] + '?autoplay=1&playsinline=1&controls=0&enablejsapi=1&rel=0&origin=' + encodeURIComponent(location.origin);
                    ram.allow = 'autoplay; encrypted-media';
                } else if (/soundcloud\.com/.test(url)) {
                    typ = 'sc';
                    ram.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
                        '&auto_play=true&visual=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&buying=false&sharing=false&download=false';
                    ram.allow = 'autoplay';
                } else return null;
                ram.title = '';
                ram.setAttribute('aria-hidden', 'true');
                ram.tabIndex = -1;
                // Utanför bild men inte display:none, annars startar inte uppspelningen i alla webbläsare
                ram.style.cssText = 'position:fixed;left:-400px;top:0;width:300px;height:200px;border:0;opacity:0;pointer-events:none;';
                ram.addEventListener('load', () => {
                    if (typ === 'yt') skicka(ram, { event: 'listening', id: 1, channel: 'widget' });
                    else { skicka(ram, { method: 'addEventListener', value: 'finish' }); skicka(ram, { method: 'play' }); }
                });
                return ram;
            }
            function visa() {
                const nu = new Date();
                knappar.forEach(k => { const el = document.getElementById(k.id); if (el) el.classList.toggle('finns', k.syns(nu)); });
            }
            knappar.forEach(k => {
                const el = document.getElementById(k.id);
                if (!el) return;
                el.addEventListener('click', () => {
                    if (aktiv && aktiv.knapp === el) { stoppa(); return; }
                    stoppa();
                    if (!k.ljud) return;                       // ingen länk inlagd ännu
                    const fil = ljudFil(k.ljud);
                    if (fil) { aktiv = { knapp: el, ram: null }; const a = skapaLjud(fil, el); aktiv.ram = a; el.classList.add('spelar'); return; }
                    const ram = skapaRam(k.ljud);
                    if (!ram) return;
                    document.body.appendChild(ram);
                    el.classList.add('spelar');
                    aktiv = { knapp: el, ram };
                });
            });
            // När låten är slut går knappen tillbaka till startläget
            window.addEventListener('message', (e) => {
                if (!aktiv || !aktiv.ram || !aktiv.ram.contentWindow || e.source !== aktiv.ram.contentWindow) return;
                try {
                    const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                    if (!d) return;
                    if (d.method === 'ready') { skicka(aktiv.ram, { method: 'addEventListener', value: 'finish' }); skicka(aktiv.ram, { method: 'play' }); }
                    if (d.method === 'finish' || (d.event === 'onStateChange' && d.info === 0)) stoppa();
                } catch (x) {}
            });
            visa();
            document.addEventListener('visibilitychange', () => { if (!document.hidden) visa(); });
        })();
    </script>
    <script>
        // ======================= HJÄLP =======================
        // Visar hjälp som passar enheten: telefon/platta (pekskärm) eller dator.
        function hjalpArTelefon() {
            try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
        }
        function hjalpArIphone() {
            const ua = navigator.userAgent || '';
            return /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }
        function hjalpText() {
            const telefon = hjalpArTelefon();
            const harKamera = !!document.getElementById('kameraKnapp') && document.getElementById('kameraKnapp').classList.contains('finns');
            const dot = (farg) => `<span class="prick" style="background:${farg}"></span>`;
            let h = '';
            h += `<h3>Så söker du</h3>
                <p>Skriv produktens namn, vårt artikelnummer eller leverantörens artikelnummer (REF) i sökfältet och tryck ${telefon ? 'på <b>Sök</b>' : 'på <b>Sök</b> eller Enter'}. Skriver du flera ord måste alla finnas i artikeln.</p>
                <ul>
                  <li>Det går bra att skriva med eller utan å, ä och ö, och bindestreck i artikelnummer spelar ingen roll.</li>
                  <li>Vill du se allt som står på en hylla skriver du platsen eller bara början på den, till exempel <b>E-05</b> (hela hyllraden), <b>E-05-04</b> eller <b>12:</b> för alla galler på hylla 12. Bulkplatser fungerar på samma sätt: skriv till exempel <b>BG5</b>, <b>BG-05</b> eller <b>BPA-27</b> så visas allt som står på den bulkplatsen. Det går bra med eller utan bindestreck och nolla.</li>
                  <li>Om du stavat lite fel eller skrivit en böjd form (handskar i stället för handske) visas liknande artiklar i en <b>gul ruta</b>. Kontrollera då att det är rätt produkt.</li>
                  <li>Siffror måste vara helt rätt. Ett artikelnummer med en siffra fel ger inga träffar, för att du inte ska få fel produkt.</li>
                  <li>Under träfflistan står hur snabbt svaret kom.</li>
                </ul>`;
            h += `<h3>Visa och sortera</h3>
                <p><b>Visa</b> väljer om du vill se Fabrikssterilt, Instrumentgaller eller båda. Minst en måste vara vald. <b>Sortera</b> ordnar träffarna efter plats, namn, artikelnummer eller leverantörens nummer.</p>`;
            h += `<h3>Platsrutorna</h3>
                <ul>
                  <li>${dot('#7fb046')}<b>Grön</b>: fabrikssterilt, med hyllplats som <b>E-05-04-01</b>.</li>
                  <li>${dot('#4687b0')}<b>Blå</b>: instrumentgaller, med plats som <b>12:3</b> (hylla:fack).</li>
                  <li>${dot('#b04671')}<b>Rosa, märkt BULK</b>: bulkplats. Den visas alltid bredvid hyllplatsen när artikeln också finns i bulk.</li>
                </ul>`;
            if (telefon && harKamera) {
                h += `<h3>Läsa av en förpackning med kameran</h3>
                <ol>
                  <li>Tryck på kameraknappen 📷 bredvid Sök. Första gången frågar telefonen om kameran får användas.</li>
                  <li>Håll telefonen stilla en bit från paketet eller hyllskylten så att numret hamnar i den vita rutan. Det kan vara numret efter <b>REF</b>, <b>Artnr</b> eller <b>Lev.artnr</b>.</li>
                  <li>Skärmen låses i stående läge medan kameran är öppen (Android). På iPhone kan webbläsaren inte låsa skärmen, så där kan du slå på <b>Lås stående riktning</b> i Kontrollcenter. Håll paketet så att texten går någorlunda vågrätt, lite sned går bra.</li>
                  <li>Appen läser texten flera gånger i sekunden. När den hittar ett nummer som finns i databasen söker den direkt. Står både artikelnumret och leverantörens nummer på etiketten går den direkt till artikeln. Hittas flera olika artiklar, eller något som bara liknar, väljer du rätt.</li>
                </ol>
                <p>Tänk på: första gången hämtas textläsaren (cirka 8 MB), så det behövs nät. Det går bäst med bra ljus och en skarp bild. Streckkoder läses inte, bara tryckt text. Om kameran inte startar kan du välja <b>Ta en bild istället</b>.</p>`;
            }
            if (telefon) {
                if (hjalpArIphone()) {
                    h += `<h3>Lägg appen på hemskärmen (iPhone)</h3>
                    <p>Öppna sidan i Safari, tryck på dela-ikonen (rutan med pilen uppåt) och välj <b>Lägg till på hemskärmen</b>. Då startar den som en vanlig app.</p>`;
                } else {
                    h += `<h3>Lägg appen på startskärmen (Android)</h3>
                    <p>Öppna sidan i Chrome, tryck på menyn (tre punkter) och välj <b>Lägg till på startskärmen</b> eller <b>Installera app</b>. Då startar den som en vanlig app.</p>`;
                }
            } else {
                h += `<h3>Kameran</h3>
                <p>Kameraknappen finns bara på telefoner och plattor, så du ser den inte på datorn.</p>
                <h3>Installera på datorn</h3>
                <p>I Chrome eller Edge kan du trycka på installationsikonen längst till höger i adressfältet för att få en egen ikon för appen.</p>`;
            }
            h += `<h3>Färgteman</h3>
                <p>Knappen med färgpaletten uppe till höger växlar mellan olika färgteman. Valet sparas på den här ${telefon ? 'telefonen' : 'datorn'}.</p>
                <h3>Start, uppdateringar och utan nät</h3>
                <p>När appen startar visas en startbild en kort stund. Appen sparar sig själv och databasen, startar direkt från den sparade kopian och fungerar även utan täckning efter första besöket. Nyare version och ny databas hämtas i bakgrunden, och sidan laddas om av sig själv om du inte har börjat söka. Längst ner står när databasen senast uppdaterades.</p>`;
            return h;
        }
        function visaHjalp() {
            document.getElementById('hjalpInnehall').innerHTML = hjalpText();
            document.getElementById('hjalpLager').hidden = false;
            document.querySelector('.hjalp-ruta').scrollTop = 0;
        }
        function stangHjalp() { document.getElementById('hjalpLager').hidden = true; }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') stangHjalp(); });
    </script>
    <script>
        // Offline-stöd: sparar sidan och databasen i telefonen/datorn.
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
            // Appen startar direkt från sparad kopia; när en nyare version hämtats laddas sidan om om man inte håller på att söka.
            navigator.serviceWorker.addEventListener('message', e => {
                if (e.data !== 'ny-version') return;
                const f = document.getElementById('searchInput');
                const kam = document.getElementById('kameraLager');
                if (f && f.value === '' && !(kam && !kam.hidden)) location.reload();
            });
        }
    </script>
</body>
</html>
